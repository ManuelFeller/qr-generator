<div class="twoColumnGrid">
	<label for="totpQrIssuer">Issuer / Platform:</label>
	<div>
		<input type="text" id="totpQrIssuer" placeholder="enter the name of the issuer here" style="width: 100%;" />
	</div>
	<label for="totpQrAccount">Account:</label>
	<div>
		<input type="text" id="totpQrAccount" placeholder="enter your account name here" style="width: 100%;" />
	</div>
	<label for="totpQrSecret">TOTP secret:</label>
	<div>
		<input type="password" id="totpQrSecret" placeholder="paste / enter the secret here" style="width: 100%;" />
	</div>
</div>
